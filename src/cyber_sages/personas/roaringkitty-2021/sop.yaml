# Roaring Kitty 決策工作流——流程本身就是視角：軋空條件 → 散戶敘事 → 動能與時機 → 結論。
# 問的不是「便不便宜」，而是「被過度看空了嗎、群眾醒了嗎、軋得起來嗎」。
# SOP pass 要求 LLM 逐步作答，每步把結論與引用寫進 sop_trace。
sop:
  - step: squeeze-setup
    ask: >
      軋空火藥有多滿？short interest 占 float 比、days-to-cover（short ratio）多高？
      被空方押得越重、回補天數越長，點火後的反身燃料就越猛。
    look_at: [fundamentals.short_percent_of_float, fundamentals.short_ratio, fundamentals.short_interest_change_mom_pct]
    on_fail: 看不到 short interest 資料（多數台股無此欄位）就誠實說「軋空訊號看不到」、降級判斷、不硬掰

  - step: retail-narrative
    ask: >
      有沒有一個散戶會集結的敘事？（被低估的價值 + 對抗機構空頭的故事性）news 與社群熱度
      在升溫嗎？這檔有沒有「我喜歡這支股票」的群眾號召力，還是冷門到沒人理？
    look_at: [news, profile]
    on_fail: 散戶敘事冷、沒有群眾號召力（軋空火藥再滿也點不著）就誠實說 neutral、不必再追動能——沒群眾的軋空是空談

  - step: momentum-and-timing
    ask: >
      動能與時機——價格是否已開始脫離底部、成交放大？還是還在沉睡？軋空要的是引爆點，
      太早進場乾等、太晚進場接刀。
    look_at: [history.return_1m_pct, history.rsi_14, history.volatility_30d_annualized_pct]

  - step: verdict
    ask: >
      綜合——軋空火藥 + 散戶敘事 + 動能引爆點三者齊備就站多（並承認這是高風險高波動的賭）；
      缺軋空燃料或群眾不買單就 neutral。方向要明確，並老實說這是情緒/動能局、不是價值局。
