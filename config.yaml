# Cyber-Sages — provider profiles 與角色→model 對映
# model 完全由使用者自選；改這裡即可，程式不硬編碼任何 model。

providers:
  anthropic:
    base_url: null                  # null = Anthropic 官方 API
    api_key_env: ANTHROPIC_API_KEY
    # Anthropic 原生能力：prompt caching / adaptive thinking / json_schema 結構化輸出
    features: [cache_control, adaptive_thinking, json_schema_output]
  minimax:
    base_url: "https://api.minimax.io/anthropic"
    api_key_env: MINIMAX_API_KEY
    # MiniMax Anthropic 相容層：不送 cache_control / thinking / output_config
    features: []

# 每個角色獨立指定 provider + model（+ 可選 max_tokens）。
# 範例：日常用 MiniMax，深度推理（辯論裁判、首席合議）用 Claude。
# max_tokens：MiniMax M2.x 強制 thinking，會先吃掉預算才吐 JSON——推理重的角色給足
# 空間，否則輸出被腰斬導致結構化解析失敗（gateway 會偵測截斷並加大重試，但設對更省）。
roles:
  data_auditor: { provider: minimax, model: MiniMax-M2.7, max_tokens: 16384 }
  analyst:      { provider: minimax, model: MiniMax-M2.7, max_tokens: 16384 }
  sage:         { provider: minimax, model: MiniMax-M2.7, max_tokens: 16384 }
  # P2 兩階段 council 的第一輪 scout：便宜/小模型即可（只要粗 stance + 信心），輸出短、
  # max_tokens 給小。未設此角色時程式回退用 sage（向後相容）。
  # ⚠ 成本提醒（review A）：此處預設與 sage 同 model，省的只是 prompt 大小與 max_tokens，
  # 不省 per-token 單價——要拿到 P2 承諾的「token 成本 ≥30% 下降」，請把 sage_scout 換成
  # 更便宜的小模型（如 provider 的 mini/haiku 級）。
  sage_scout:   { provider: minimax, model: MiniMax-M2.7, max_tokens: 4096 }
  debater:      { provider: minimax, model: MiniMax-M3,   max_tokens: 16384 }
  judge:        { provider: minimax, model: MiniMax-M3,   max_tokens: 16384 }
  chief:        { provider: minimax, model: MiniMax-M3,   max_tokens: 16384 }
  risk:         { provider: minimax, model: MiniMax-M3,   max_tokens: 16384 }

# 資料審核閘門參數
audit:
  max_price_divergence_pct: 2.0     # 跨來源價格容差（%）
  max_quote_age_days: 5             # 報價最大允許天數（涵蓋連假）
  max_fundamentals_age_days: 120    # 財報資料最大允許天數（一季 + 緩衝）
  max_macro_age_days: 45            # 總經序列最大允許天數（月頻 + 緩衝）

# 引用驗證
citation:
  numeric_tolerance_pct: 1.0        # claim 數字 vs evidence 容差（四捨五入誤差）
  max_rewrite_attempts: 2

defaults:
  sages: 10                         # 出席大師數
  debate_rounds: 1
  max_tokens: 8192
  include_macro: true               # 帶入 FRED 總經背景（需 FRED_API_KEY；--no-macro 可關）
  # P2：房間 > 此數才走兩階段 council（scout→只深入代表）。DK 2026-06-15 定調：推理完整性
  # 優先於省 token，故設高讓全員深入（兩階段在 N≈9 反而更貴且把重量級大師降成 scout 淺層）。
  # 未來 N≫此數、且 scout 換便宜小模型 + prompt 瘦身後再下調重啟兩階段（見 issue #55）。
  deep_budget: 999
