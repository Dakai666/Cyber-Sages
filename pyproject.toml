[project]
name = "cyber-sages"
version = "0.1.0"
description = "Cyber-Sages — multi-sage AI agent team for verifiable financial analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.92.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "typer>=0.15",
    "yfinance>=0.2.50",
    "httpx>=0.27",
    "certifi>=2024.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
cyber-sages = "cyber_sages.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_sages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
